name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Inštalácia závislostí
        run: pnpm install --frozen-lockfile

      - name: Testy
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # Stránky sú dynamické, build sa k databáze nepripája.
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci

      # Až po builde — Next.js generuje typy routes do .next/types
      - name: Typová kontrola
        run: pnpm typecheck
