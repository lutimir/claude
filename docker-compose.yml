# Vývojové prostredie — len databáza.
# Web a worker sa počas vývoja spúšťajú cez pnpm (pozri README).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app0
      POSTGRES_PASSWORD: app0
      POSTGRES_DB: app0
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app0 -d app0"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
