# Produkčné nasadenie na VPS — kompletný stack s HTTPS, migráciami a zálohami.
# Postup: pozri DEPLOY.md. Spustenie: docker compose -f docker-compose.prod.yml up -d --build
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app0}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?nastav v .env}
      POSTGRES_DB: ${POSTGRES_DB:-app0}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app0}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Jednorazová služba: aplikuje migrácie pred štartom webu a workera
  migrate:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    command: ["pnpm", "--filter", "@app0/db", "run", "db:migrate"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-app0}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-app0}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-app0}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-app0}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-App0}
      APP_BASE_URL: ${APP_BASE_URL}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-console}
      MAIL_FROM: ${MAIL_FROM}
      RESEND_API_KEY: ${RESEND_API_KEY}
      SMTP_URL: ${SMTP_URL}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-app0}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-app0}
      FEED_FETCH_CONTACT: ${FEED_FETCH_CONTACT}
      APP_BASE_URL: ${APP_BASE_URL:-http://web:3000}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-console}
      MAIL_FROM: ${MAIL_FROM}
      RESEND_API_KEY: ${RESEND_API_KEY}
      SMTP_URL: ${SMTP_URL}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

  # Denné zálohy s rotáciou (držíme posledných 14)
  backup:
    image: postgres:17-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          pg_dump -h postgres -U ${POSTGRES_USER:-app0} ${POSTGRES_DB:-app0} \
            | gzip > /backups/app0-$$(date +%F-%H%M).sql.gz \
            && echo "Záloha hotová: app0-$$(date +%F-%H%M).sql.gz"
          ls -1t /backups/*.sql.gz 2>/dev/null | tail -n +15 | xargs -r rm
          sleep 86400
        done
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  backups:
